# Wakes the free-plan Render server on a schedule so the daily jobs actually run.
# The morning brief has its own workflow (morning-brief.yml); a wake-up later in the
# day still checks for a missed brief, but never sends after 12:00 IST.
# Needs one GitHub repository secret (Settings > Secrets and variables > Actions):
#   ADMIN_TRIGGER_KEY  the same value as ADMIN_TRIGGER_KEY in Render
# The backend URL is public, so it is set below (a BACKEND_URL variable can override it).
name: wake-server
on:
  workflow_dispatch: {}
  schedule:
    - cron: '32 3 * * *'       # 09:02 IST  subscription lifecycle
    - cron: '35 4-9 * * 1-5'   # 10:05-15:05 IST hourly: market data + flash alerts
    - cron: '5 11 * * 1-5'     # 16:35 IST  track record
    - cron: '35 12 * * 1-5'    # 18:05 IST  AI lever scan
    - cron: '35 16 * * 1-5'    # 22:05 IST  opportunity engine
    - cron: '35 14 * * 0'      # 20:05 IST Sunday  weekly instrument scoring
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the server and run whatever is due
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://wealthguard-backend.onrender.com' }}
          ADMIN_TRIGGER_KEY: ${{ secrets.ADMIN_TRIGGER_KEY }}
        run: |
          # Strip stray spaces/newlines from pasted values and any trailing slash.
          BACKEND_URL="$(printf '%s' "$BACKEND_URL" | tr -d '[:space:]')"; BACKEND_URL="${BACKEND_URL%/}"
          ADMIN_TRIGGER_KEY="$(printf '%s' "$ADMIN_TRIGGER_KEY" | tr -d '[:space:]')"
          case "$BACKEND_URL" in https://*) ;; *) BACKEND_URL="https://$BACKEND_URL" ;; esac
          if [ -z "$ADMIN_TRIGGER_KEY" ]; then echo "Missing ADMIN_TRIGGER_KEY secret"; exit 1; fi
          echo "Calling $BACKEND_URL/api/admin/wake"
          # A cold start can take 1-2 minutes, so allow long waits and retry.
          curl -sS --fail-with-body --max-time 180 --retry 4 --retry-delay 20 --retry-all-errors \
            -H "x-admin-key: $ADMIN_TRIGGER_KEY" "$BACKEND_URL/api/admin/wake"
